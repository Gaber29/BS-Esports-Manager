<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Manager: PARALLAX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">PARALLAX<span class="accent">.MNG</span></div>
            <nav class="menu">
                <button onclick="uiManager.showScreen('dashboard')">Дашборд</button>
                <button onclick="uiManager.showScreen('roster')">Состав</button>
                <button onclick="uiManager.showScreen('market')">Трансферы</button>
                <button onclick="uiManager.showScreen('tournaments')">Турниры</button>
            </nav>
            <div class="controls">
                <button class="btn-advance" onclick="gameEngine.advanceDay()">Следующий день ⏭️</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="date" id="ui-date">День 1 / Месяц 1 / 2026</div>
                <div class="stats">
                    <span class="budget" id="ui-budget">Бюджет: $50,000</span>
                    <span class="points" id="ui-points">BSC Points: 0</span>
                </div>
            </header>

            <section id="screen-dashboard" class="screen active">
                <h2>Главная панель</h2>
                <div class="news-feed" id="news-feed">
                    <p>Добро пожаловать в менеджмент. Соберите состав из 3 игроков для начала сезона.</p>
                </div>
            </section>

            <section id="screen-roster" class="screen">
                <h2>Состав команды</h2>
                <div id="roster-list" class="grid-list"></div>
            </section>

            <section id="screen-market" class="screen">
                <h2>Свободные агенты</h2>
                <div id="market-list" class="grid-list"></div>
            </section>
            
            <section id="screen-tournaments" class="screen">
                <h2>Рейтинг команд</h2>
                <div id="standings-list" class="grid-list"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
